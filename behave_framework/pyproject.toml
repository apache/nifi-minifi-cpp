[project]
name = "minifi-behave"
version = "0.3.0"
requires-python = ">= 3.10"
description = "A testing framework for MiNiFi extensions."
dependencies = [
    "behavex==4.6.0",
    "docker==7.1.0",
    "PyYAML==6.0.3",
    "humanfriendly==10.0",
    "cryptography==50.0.0",
    "pyjks==20.0.0",
    "certifi>=2026.7.22"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["minifi_behave*"]

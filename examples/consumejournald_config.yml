    FlowFiles To Log: 0
    Log Level: info
    Log Payload: true
    Log Prefix: '====='
    Maxumim Payload Line Length: 0
Connections:
- name: ConsumeJournald/success/LogAttribute
  id: f57713d9-fa0b-4416-948d-4b316b1a1c0d
  source id: 66fbb65d-8b11-43a9-aaad-746a07d2fe35

github:
  description: "Apache NiFi - MiNiFi C++"
  homepage: https://nifi.apache.org/minifi/
  labels:
    - nifi
    - minifi
    - cpp
    - hacktoberfest
  features:
    wiki: false
    issues: false
    projects: false
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  ghp_branch: main
  ghp_path: /docs
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
notifications:
  commits: commits@nifi.apache.org
  issues: issues@nifi.apache.org
  jira_options: link label worklog

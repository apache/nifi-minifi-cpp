name: "MiNiFi-CPP memcheck"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
env:
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Debug
    -DCI_BUILD=ON
    -DDOCKER_BUILD_ONLY=OFF
    -DENABLE_ALL=ON
    -DENABLE_TEST_PROCESSORS=ON
    -DMINIFI_FAIL_ON_WARNINGS=ON
    -DPORTABLE=ON
    -DUSE_SHARED_LIBS=ON
  SCCACHE_GHA_ENABLE: true
  CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/.ccache
jobs:
  valgrind:
    name: "Valgrind on ubuntu-24.04"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - id: checkout
        uses: actions/checkout@v6
      - name: cache restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-valgrind-ccache-${{github.ref}}-${{github.sha}}
          restore-keys: |
            ubuntu-24.04-valgrind-ccache-${{github.ref}}-
            ubuntu-24.04-valgrind-ccache-refs/heads/main-
      - id: install_deps
        run: |
          sudo apt update
          sudo apt install -y ccache libfl-dev python3 python3-venv valgrind
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          echo -e "127.0.0.1\t$HOSTNAME" | sudo tee -a /etc/hosts > /dev/null
      - name: build
        run: |
          python3 -m venv venv && source venv/bin/activate \
            && pip install -r requirements.txt \
            && python main.py --noninteractive --minifi-options="${CMAKE_FLAGS}"
        working-directory: bootstrap
      - name: cache save
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-valgrind-ccache-${{github.ref}}-${{github.sha}}
      - name: test
        id: test
        run: |
          # Set core file size limit to unlimited
          ulimit -c unlimited
          ctest -j$(nproc) -L memchecked -T memcheck
        working-directory: build
      - name: check valgrind output
        id: check
        run: |
          nonempty_valgrind_outputs=$(find Testing/Temporary -maxdepth 1 -name 'MemoryChecker.*.log' -size +0 -print)
          if [ -n "$nonempty_valgrind_outputs" ]; then
            echo "::error::Valgrind reported issues in one or more tests."
            exit 1
          fi
          echo "Valgrind report is clean."
        working-directory: build
      - name: upload memcheck logs
        if: ${{ failure() && steps.check.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: memcheck-logs
          path: |
            build/Testing/Temporary/MemoryChecker.*.log
            build/Testing/Temporary/LastDynamicAnalysis_*.log
          if-no-files-found: ignore
  address-sanitizer:
    name: "AdressSanitizer+LeakSanitizer on ubuntu 26.04"
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - id: checkout
        uses: actions/checkout@v6
      - name: cache restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-26.04-asan-ccache-${{github.ref}}-${{github.sha}}
          restore-keys: |
            ubuntu-26.04-asan-ccache-${{github.ref}}-
            ubuntu-26.04-asan-ccache-refs/heads/main-
      - id: install_deps
        run: |
          sudo apt update
          sudo apt install -y ccache libfl-dev python3 python3-venv
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          echo -e "127.0.0.1\t$HOSTNAME" | sudo tee -a /etc/hosts > /dev/null
      - name: build
        run: |
          python3 -m venv venv && source venv/bin/activate \
            && pip install -r requirements.txt \
            && python main.py --noninteractive --minifi-options="${CMAKE_FLAGS} -DMINIFI_ADVANCED_ASAN_BUILD=ON" --cmake-options="-DSTRICT_GSL_CHECKS=AUDIT"
        working-directory: bootstrap
      - name: cache save
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-26.04-asan-ccache-${{github.ref}}-${{github.sha}}
      - name: test
        id: test
        run: |
          # Set core file size limit to unlimited
          ulimit -c unlimited
          ctest -j$(nproc) --output-on-failure
        working-directory: build
      - name: upload ASan/LSan output
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: asan-logs
          path: build/asan_logs/*
          if-no-files-found: ignore

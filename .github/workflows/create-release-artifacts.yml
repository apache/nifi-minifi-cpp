name: "Create Release Artifacts"

on:
  workflow_dispatch:
    inputs:
      enable_conan:
        type: boolean
        description: Enable Conan package manager usage
        default: false
  schedule:
  - cron: '0 1 * * 1'
env:
  CMAKE_FLAGS: -DCMAKE_BUILD_TYPE=Release -DCI_BUILD=OFF -DENABLE_ALL=ON -DMINIFI_FAIL_ON_WARNINGS=OFF -DDOCKER_BUILD_ONLY=ON -DSKIP_TESTS=ON \
    -DDOCKER_USE_CONAN=${{ inputs.enable_conan && 'ON' || 'OFF' }} -DDOCKER_NIFI_CONAN_USER=${{ secrets.CONAN_USERNAME }} -DDOCKER_NIFI_CONAN_PASSWORD=${{ secrets.CONAN_ACCESS_TOKEN }}
  CONAN_LOGIN_USERNAME_NIFI_CONAN: ${{ secrets.CONAN_USERNAME }}
  CONAN_PASSWORD_NIFI_CONAN: ${{ secrets.CONAN_ACCESS_TOKEN }}

jobs:
  build-linux-artifacts:
    if: (github.event_name == 'schedule' && github.repository == 'apache/nifi-minifi-cpp') || (github.event_name != 'schedule')
    name: "Build package (${{ matrix.platform.arch }})"
    runs-on: ${{ matrix.platform.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { arch: "x86_64", tar-artifact: "minifi-x86_64-tar", rpm-artifact: "minifi-x86_64-rpm" },
          { arch: "aarch64", tar-artifact: "minifi-aarch64-tar", rpm-artifact: "minifi-aarch64-rpm" }
        ]

    steps:
      - id: checkout
        uses: actions/checkout@v6

      - id: install_deps
        run: |
          sudo apt update
          sudo apt install -y cmake

      - id: build
        run: |
          mkdir build && cd build && cmake ${CMAKE_FLAGS} .. && make rocky

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.tar-artifact }}
          path: build/nifi-minifi-cpp-*-bin-rockylinux.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.rpm-artifact }}
          path: build/nifi-minifi-cpp-*.rpm

      - id: cargo
        working-directory: minifi_rust
        run: |
          cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: minifi_rust_extensions
          path: minifi_rust/target/release/*.so
  windows_VS2022:
    name: "Windows Server 2025 x86_64"
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Set up Python
        run: choco -y install python & refreshenv
        shell: cmd
      - name: Install sqliteodbc driver
        run: |
          Invoke-WebRequest -Uri "http://www.ch-werner.de/sqliteodbc/sqliteodbc_w64.exe" -OutFile "sqliteodbc_w64.exe"
          if ((Get-FileHash 'sqliteodbc_w64.exe').Hash -ne "a4804e4f54f42c721df1323c5fcac101a8c7a577e7f20979227324ceab572d51") {Write "Hash mismatch"; Exit 1}
          Start-Process -FilePath ".\sqliteodbc_w64.exe" -ArgumentList "/S" -Wait
        shell: powershell
      - name: Copy conan compatibility.py
        shell: powershell
        if: always() && ${{ inputs.enable_conan }}
        run: |
          $compatDir = Join-Path $env:USERPROFILE ".conan2\extensions\plugins\compatibility"
          New-Item -ItemType Directory -Force -Path $compatDir | Out-Null
          Copy-Item ".github\conan\compatibility.py" (Join-Path $compatDir "compatibility.py")
      - name: build
        run: |
          python -m venv venv && venv\Scripts\activate && pip install -r requirements.txt && ^
          python main.py --noninteractive --skip-compiler-install --minifi-options="-DCMAKE_BUILD_TYPE=Release -DCI_BUILD=OFF -DENABLE_ALL=ON -DMINIFI_FAIL_ON_WARNINGS=OFF -DSKIP_TESTS=ON -DUSE_CONAN=${{ inputs.enable_conan && 'ON' || 'OFF' }}"
        shell: cmd
        working-directory: bootstrap
      - name: Upload conan packages
        if: always() && ${{ inputs.enable_conan }}
        working-directory: bootstrap
        run: |
          venv\Scripts\activate && conan remote login nifi-conan && conan upload "*" -r nifi-conan --confirm
        shell: cmd
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minifi-x86_64-msi
          path: build/nifi-minifi-cpp.msi
  extension-sdk:
    name: "Extension SDK"
    runs-on: 'ubuntu-24.04-arm'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Build Python Wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          cd behave_framework
          python -m build

      - name: Bundle SDK Artifacts into ZIP
        run: |
          mkdir minifi-native-sdk

          cp behave_framework/dist/*.whl minifi-native-sdk/
          cp minifi-api/minifi-api.def minifi-native-sdk/
          cp minifi-api/include/minifi-api.h minifi-native-sdk/

          zip -r minifi-native-sdk.zip minifi-native-sdk/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minifi-native-sdk
          path: minifi-native-sdk.zip
